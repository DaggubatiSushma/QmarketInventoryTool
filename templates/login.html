<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Sign in | Stockroom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% include "_pwa_head.html" %}
</head>
<body class="login-page">
  <main class="login-card">
    <span class="brand-icon" aria-hidden="true">S</span>
    <p class="eyebrow">YOUR SHELVES, SORTED</p>
    <h1>Welcome to Stockroom.</h1>
    <p class="muted">A simple space for your products, inventory, and shopping list.</p>
    <form method="post">
      <input type="hidden" name="csrf" value="{{ session.csrf }}">
      <label for="password">Team password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" autofocus>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
      <button class="primary full-width" type="submit">Sign in to your inventory &rarr;</button>
    </form>
    <p class="small muted">Private inventory. One shared team workspace.</p>
    {% include "_install.html" %}
  </main>
</body>
</html>
