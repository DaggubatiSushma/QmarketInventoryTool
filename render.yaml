services:
  - type: web
    name: stockroom
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT 'main:create_app()'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: INVENTORY_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stockroom-db
          property: connectionString
databases:
  - name: stockroom-db
    plan: basic-256mb
